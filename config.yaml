model_list:
  # 🚀 MODELLO STANDARD (Groq) - Llama 3.3 70B
  - model_name: Base
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: 'os.environ/GROQ_API_KEY'

  # 🧠 MODELLO PENSIERO (Groq) - DeepSeek R1
  - model_name: francesca-reasoning
    litellm_params:
      model: groq/deepseek-r1-distill-llama-70b
      api_key: 'os.environ/GROQ_API_KEY'

  # 🔓 MODELLO LIBERO (Ollama Locale) - Dolphin
  - model_name: francesca-ollama
    litellm_params:
      model: ollama/dolphin-pro
      api_base: http://localhost:11434

  # 👁️ MODELLO VISION (Groq) - Llama 3.2 Vision
  - model_name: francesca-vision
    litellm_params:
      model: groq/llama-3.2-11b-vision-preview
      api_key: 'os.environ/GROQ_API_KEY'

general_settings:
  master_key: sk-mj-center # La chiave che userai in axios nel tuo brain.mjs
